

baseURL = "https://sahilmir18.github.io/blog/"
languageCode = "en-us"
theme = "terminal"
paginate = 5

[params]
  # folder under content/ that holds your posts
  contentTypeName = "posts"
  # theme accent color: orange | blue | red | green | pink
  themeColor = "green"
  # show intro text on homepage instead of just post list
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false

[markup]
  [markup.highlight]
    noClasses = false

[languages]
  [languages.en]
    languageName = "English"
    title = "Sahil's Terminal Blog"
    subtitle = "Cybersecurity research & writeups"
    keywords = ""
    copyright = ""
    readMore = "Read more"
    readOtherPosts = "Read other posts"
    menuMore = "Show more"

    [languages.en.params.logo]
      logoText = "blog@sahilmir18:~$"
      logoHomeLink = "/blog/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "about"
        url = "/blog/about"
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "posts"
        url = "/blog/posts"